[workspace]
resolver = "2"
members = [
    "crates/singine-photo-scan",
    "crates/singine-mcp-rs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Singine Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
