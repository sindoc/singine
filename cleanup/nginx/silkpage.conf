# silkpage.conf — Nginx configuration for the cleanup silkpage site
#
# Two server blocks:
#   cdn.example.org  — CDN origin: serves all static assets (CSS, JS, images)
#   localhost / *    — Main site: silkpage HTML + /api/report JSON endpoint
#
# Include from nginx.conf:
#   include /path/to/cleanup/nginx/silkpage.conf;
#
# Or reference via SILKPAGE_ROOT env variable:
#   envsubst '$SILKPAGE_ROOT $CDN_HOST $SITE_PORT' < silkpage.conf | nginx -c /dev/stdin
#
# Environment variables consumed (set in shell or passed via envsubst):
#   SILKPAGE_ROOT   — absolute path to this cleanup/ directory
#   CDN_HOST        — CDN hostname (default: cdn.example.org)
#   SITE_PORT       — main site port (default: 8090)
#   REPORT_DIR      — path to report/ directory (default: $SILKPAGE_ROOT/report)

# ── CDN origin server ─────────────────────────────────────────────────────────
server {
    listen      80;
    listen      443 ssl;
    server_name cdn.example.org ${CDN_HOST};

    # TLS — replace with real certs or use certbot
    # ssl_certificate     /etc/ssl/certs/cdn.example.org.crt;
    # ssl_certificate_key /etc/ssl/private/cdn.example.org.key;

    root ${SILKPAGE_ROOT}/output;

    # Serve CSS, JS, and image assets with long cache + CORS
    location /assets/ {
        add_header Cache-Control  "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # CDN map: rewrite /assets/css/ → silkpage/src/css/
    location /assets/css/ {
        alias ${SILKPAGE_ROOT}/silkpage/src/css/;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*";
    }

    location /assets/js/ {
        alias ${SILKPAGE_ROOT}/silkpage/src/js/;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*";
    }

    # Preflight
    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Max-Age       86400;
            return 204;
        }
        try_files $uri $uri/index.html =404;
    }
}

# ── singine.uk — /latest/ATOM feed + site ─────────────────────────────────────
#
# singine URN → URL mapping:
#   urn:singine:cleanup:disk:<id>    →  https://singine.uk/cleanup.html#<id>
#   urn:singine:cleanup:session:<d>  →  https://singine.uk/latest/ATOM
#
# /latest/ATOM is the primary syndication endpoint for this result set.
# Content-Type: application/atom+xml (RFC 4287)
server {
    listen      80;
    listen      443 ssl;
    server_name singine.uk www.singine.uk;

    # ssl_certificate     /etc/ssl/certs/singine.uk.crt;
    # ssl_certificate_key /etc/ssl/private/singine.uk.key;

    root ${SILKPAGE_ROOT}/output;
    index cleanup.html index.html;

    # /latest/ATOM — Atom feed (no extension; Nginx sets Content-Type)
    location = /latest/ATOM {
        alias      ${SILKPAGE_ROOT}/output/latest/ATOM;
        default_type application/atom+xml;
        add_header Content-Type  "application/atom+xml; charset=utf-8";
        add_header Cache-Control "public, max-age=300";       # 5-min cache
        add_header Access-Control-Allow-Origin "*";
        add_header X-Singine-URN "urn:singine:cleanup:session:latest";
    }

    # /latest/ directory listing — redirect to the ATOM feed
    location = /latest/ {
        return 302 /latest/ATOM;
    }

    # /api/report — live JSON (same as main site)
    location = /api/report {
        alias      ${REPORT_DIR:-${SILKPAGE_ROOT}/report}/latest.json;
        add_header Content-Type  "application/json; charset=utf-8";
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
    }

    # Static output (cleanup.html, etc.)
    location / {
        add_header X-Frame-Options SAMEORIGIN;
        try_files $uri $uri/ $uri.html =404;
    }

    # CDN redirect for assets
    location ~* \.(css|js|woff2?|svg|png|jpg|ico)$ {
        return 301 //cdn.example.org$request_uri;
    }

    gzip on;
    gzip_types text/html application/atom+xml application/json text/css application/javascript;
}

# ── Main site ─────────────────────────────────────────────────────────────────
server {
    listen      ${SITE_PORT:-8090};
    server_name localhost;

    root ${SILKPAGE_ROOT}/output;
    index cleanup.html index.html;

    # /api/report — serves the latest scan JSON directly
    location = /api/report {
        alias      ${REPORT_DIR:-${SILKPAGE_ROOT}/report}/latest.json;
        add_header Content-Type  "application/json; charset=utf-8";
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
    }

    # /api/scan — trigger a fresh scan (singine dispatches to scan.sh)
    location = /api/scan {
        # POST only; GET returns method not allowed
        limit_except POST { deny all; }
        proxy_pass  http://127.0.0.1:3000/singine/exec;
        proxy_set_header X-Singine-Command "scan";
        proxy_read_timeout 120;
    }

    # Static silkpage output
    location / {
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        try_files $uri $uri/ $uri.html =404;
    }

    # Redirect asset requests to CDN
    location ~* \.(css|js|woff2?|svg|png|jpg|ico)$ {
        return 301 //cdn.example.org$request_uri;
    }

    # Gzip
    gzip            on;
    gzip_types      text/html text/css application/javascript application/json;
    gzip_min_length 1024;
}
