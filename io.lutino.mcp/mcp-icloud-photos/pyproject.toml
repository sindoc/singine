[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "singine-mcp-icloud-photos"
version = "0.1.0"
description = "MCP server for iCloud Photos: query, export originals, metadata, deletion manifest via osxphotos"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "osxphotos>=0.68",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
singine-mcp-icloud-photos = "server:main"

[tool.pytest.ini_options]
testpaths = ["../../../py/tests"]
python_files = ["test_icloud*.py"]
