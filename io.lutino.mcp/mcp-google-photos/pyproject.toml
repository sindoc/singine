[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "singine-mcp-google-photos"
version = "0.1.0"
description = "MCP server for Google Photos: list, download, metadata via OAuth2 REST API"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
singine-mcp-google-photos = "server:main"

[tool.pytest.ini_options]
testpaths = ["../../../py/tests"]
python_files = ["test_google_photos*.py"]
